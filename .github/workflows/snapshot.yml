# StageMix scheduler. One secret, STAGEMIX_ENV (KEY=value lines); every value is masked before anything uses it.
name: snapshot
on:
  schedule:
    - cron: "0 6 * * *"    # 14:00 Taipei, full
    - cron: "0 9 * * *"    # 17:00, new uploads only
    - cron: "0 12 * * *"   # 20:00, full
    - cron: "0 15 * * *"   # 23:00, new uploads only
    - cron: "0 18 * * *"   # 02:00, new uploads only
  workflow_dispatch:
    inputs:
      budget:
        description: "Data API units"
        default: "200"
permissions:
  contents: read
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Unpack secret
        env:
          BLOB: ${{ secrets.STAGEMIX_ENV }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_BUDGET: ${{ github.event.inputs.budget }}
        run: |
          [ -n "$BLOB" ] || { echo "STAGEMIX_ENV is not set"; exit 1; }
          keys='^(STAGEMIX_REPO|STAGEMIX_REPO_TOKEN|R2_ACCOUNT_ID|R2_ACCESS_KEY_ID|R2_SECRET_ACCESS_KEY|SNAPSHOT_PREFIX|YOUTUBE_API_KEY|KVCC_CFG_TOKEN)=.+$'
          # Mask every value first, then export: the other way round a value would show once in the log.
          # Escaped as workflow-command data (%, CR, LF), or the runner would register a different string.
          while IFS= read -r line; do
            [[ "$line" =~ $keys ]] || continue
            v=${line#*=}; v=${v//%/%25}; v=${v//$'\r'/%0D}
            echo "::add-mask::$v"
          done <<< "$BLOB"
          while IFS= read -r line; do
            [[ "$line" =~ $keys ]] && echo "$line" >> "$GITHUB_ENV"
          done <<< "$BLOB"
          case "$SCHEDULE" in
            "0 6 * * *") b=2500 ;; "0 12 * * *") b=6400 ;; "") b="$INPUT_BUDGET" ;; *) b=200 ;;
          esac
          [[ "$b" =~ ^[0-9]+$ ]] || b=200
          echo "BUDGET=$b" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.STAGEMIX_REPO }}
          token: ${{ env.STAGEMIX_REPO_TOKEN }}
          path: src
          persist-credentials: false
      - name: Swift toolchain
        run: swift --version || { echo "no swift on this runner"; cat /etc/os-release | head -2; }
      - name: rclone
        run: sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq rclone > /dev/null
      - name: Run
        run: STAGEMIX_REPO_TOKEN= src/tools/snapshot/ci-run.sh "$GITHUB_WORKSPACE/work"
  # Public repos lose their schedule after 60 days without a commit: re-enable it every run (no dummy commits).
  # Its own job, so only this one holds actions: write.
  keepalive:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/snapshot.yml/enable
