# StageMix scheduler. One secret, STAGEMIX_ENV (KEY=value lines); every value is masked before anything uses it.
name: snapshot
# Started by the stagemix-cron Worker (cron/), on time; GitHub's own schedule ran 7-10 h late.
on:
  workflow_dispatch:
    inputs:
      budget:
        description: "Data API units"
        default: "200"
permissions:
  contents: read
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04   # with the Swift tarball below (26.04 has no libxml2.so.2)
    timeout-minutes: 340
    steps:
      - name: Unpack secret
        env:
          BLOB: ${{ secrets.STAGEMIX_ENV }}
          INPUT_BUDGET: ${{ github.event.inputs.budget }}
        run: |
          [ -n "$BLOB" ] || { echo "STAGEMIX_ENV is not set"; exit 1; }
          keys='^(STAGEMIX_REPO|STAGEMIX_REPO_TOKEN|R2_ACCOUNT_ID|R2_ACCESS_KEY_ID|R2_SECRET_ACCESS_KEY|SNAPSHOT_PREFIX|YOUTUBE_API_KEY|KVCC_CFG_TOKEN)=.+$'
          # Mask every value first, then export: the other way round a value would show once in the log.
          # Escaped as workflow-command data (%, CR, LF), or the runner would register a different string.
          while IFS= read -r line; do
            [[ "$line" =~ $keys ]] || continue
            v=${line#*=}; v=${v//%/%25}; v=${v//$'\r'/%0D}
            echo "::add-mask::$v"
          done <<< "$BLOB"
          while IFS= read -r line; do
            [[ "$line" =~ $keys ]] && echo "$line" >> "$GITHUB_ENV"
          done <<< "$BLOB"
          b="$INPUT_BUDGET"
          [[ "$b" =~ ^[0-9]+$ ]] || b=200
          echo "BUDGET=$b" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.STAGEMIX_REPO }}
          token: ${{ env.STAGEMIX_REPO_TOKEN }}
          path: src
          persist-credentials: false
      # Pinned: the runner's own Swift moved 6.4.2 -> 6.4.3 in one day, and the state is kept per toolchain (a new
      # one rebuilds everything, ~70 min). To move on, change both lines; the first run after that rebuilds once.
      - name: Swift toolchain
        env:
          SWIFT: swift-6.4.3-RELEASE
          SHA256: 9456e95bcbf73849dde44c90e94c6e4f747f72b35f70891eb7ea8562a2aea202
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swift.tgz" "https://download.swift.org/$(echo "$SWIFT" | tr A-Z a-z)/ubuntu2404/$SWIFT/$SWIFT-ubuntu24.04.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/swift.tgz" | sha256sum -c --quiet
          mkdir "$RUNNER_TEMP/swift" && tar -xzf "$RUNNER_TEMP/swift.tgz" -C "$RUNNER_TEMP/swift" --strip-components=1
          rm "$RUNNER_TEMP/swift.tgz"
          echo "$RUNNER_TEMP/swift/usr/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swift/usr/bin/swift" --version
      - name: rclone
        run: sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq rclone > /dev/null
      - name: Run
        run: STAGEMIX_REPO_TOKEN= src/tools/snapshot/ci-run.sh "$GITHUB_WORKSPACE/work"
